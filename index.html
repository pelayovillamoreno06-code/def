<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Para ti 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ⚙️  CONFIGURACIÓN RÁPIDA  (edita también en el <script>)
   ========================================================= */

:root{
  --green:#00FF00;
  --pink-bg:#FFE5EC;
  --pink:#FF8FB1;
  --pink-strong:#FF5C8A;
  --white:#FFFFFF;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  position:fixed;        /* evita el bounce de Safari iOS */
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;          /* viewport dinámico real en móvil */
  touch-action:none;      /* CRÍTICO: nada de scroll/rebote/gestos */
  overscroll-behavior:none;
  font-family:'Fredoka',system-ui,sans-serif;
}

/* área segura para notch / isla dinámica / barra inferior */
.safe{
  position:absolute;
  inset:0;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}

/* ---------- pantallas ---------- */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  opacity:0;
  pointer-events:none;
  transition:opacity .9s ease;
}
.screen.active{opacity:1;pointer-events:auto;}

/* =========================================================
   FASE 0 — DESBLOQUEO DE AUDIO
   ========================================================= */
#unlock{
  background:#000;
  align-items:center;
  justify-content:center;
  opacity:1;pointer-events:auto;
  z-index:50;
}
#unlock .tap{
  font-family:'Fredoka',monospace;
  color:#bbb;
  font-size:clamp(15px,4.5vw,22px);
  letter-spacing:1px;
  text-align:center;
  padding:0 24px;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* =========================================================
   FASE 1/2/3 — TERMINAL
   ========================================================= */
#terminal{
  background:#000;
  flex-direction:column;
  z-index:40;
}
#terminal .term-inner{
  position:absolute;
  inset:0;
  padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 22px) 18px;
  display:flex;
  flex-direction:column;
  font-family:'Courier New',Courier,monospace;
  color:var(--green);
  text-shadow:0 0 6px rgba(0,255,0,.55);
  font-size:clamp(13px,3.9vw,18px);
  line-height:1.55;
  overflow:hidden;
}
#termText{white-space:pre-wrap;flex:1;}
.cursor{
  display:inline-block;
  width:.6em;height:1.05em;
  background:var(--green);
  margin-left:2px;
  vertical-align:middle;
  animation:blink 1s steps(1) infinite;
  box-shadow:0 0 8px rgba(0,255,0,.7);
}
@keyframes blink{50%{opacity:0}}

#termButtons{
  display:flex;
  gap:16px;
  justify-content:center;
  margin-top:18px;
  opacity:0;
  transition:opacity .4s ease;
}
#termButtons.show{opacity:1;}
.term-btn{
  flex:1;
  max-width:160px;
  background:transparent;
  border:2px solid var(--green);
  color:var(--green);
  font-family:'Courier New',monospace;
  font-size:clamp(16px,5vw,22px);
  font-weight:bold;
  padding:14px 0;
  letter-spacing:2px;
  cursor:pointer;
  text-shadow:0 0 6px rgba(0,255,0,.6);
  box-shadow:0 0 12px rgba(0,255,0,.25), inset 0 0 12px rgba(0,255,0,.1);
  transition:transform .08s, background .15s;
}
.term-btn:active{transform:scale(.94);background:rgba(0,255,0,.18);}

/* glitch / parpadeo inverso */
.glitch-flash{animation:glitchFlash .15s steps(2) 1;}
@keyframes glitchFlash{
  0%{filter:invert(1) brightness(2);}
  50%{filter:invert(0) brightness(.2);}
  100%{filter:none;}
}

/* =========================================================
   FASE 4 — MUNDO HELLO KITTY
   ========================================================= */
#kitty{
  background:linear-gradient(160deg,#FFE5EC 0%,#FFD6E8 55%,#FFC2DD 100%);
  flex-direction:column;
  z-index:30;
}
#kitty .kitty-inner{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* corazones de fondo */
.bg-hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.bg-hearts span{
  position:absolute;
  bottom:-40px;
  font-size:22px;
  opacity:.55;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0);opacity:0;}
  10%{opacity:.6;}
  90%{opacity:.6;}
  100%{transform:translateY(-115vh) rotate(360deg);opacity:0;}
}

/* contador */
#counterWrap{
  position:relative;
  z-index:2;
  text-align:center;
  padding:14px 12px 6px;
}
#counterWrap .title{
  font-family:'Pacifico',cursive;
  color:var(--pink-strong);
  font-size:clamp(20px,6vw,30px);
  text-shadow:0 2px 0 #fff;
  margin-bottom:8px;
}
#counter{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
}
#counter .unit{
  background:rgba(255,255,255,.75);
  border:2px solid #fff;
  border-radius:14px;
  padding:6px 8px;
  min-width:54px;
  box-shadow:0 4px 10px rgba(255,92,138,.18);
}
#counter .num{
  display:block;
  font-weight:700;
  font-size:clamp(16px,4.6vw,22px);
  color:var(--pink-strong);
  line-height:1;
}
#counter .lbl{
  display:block;
  font-size:clamp(9px,2.6vw,11px);
  color:#c77;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-top:3px;
}

/* score */
#scoreBar{
  position:relative;z-index:2;
  text-align:center;
  font-weight:600;
  color:var(--pink-strong);
  font-size:clamp(15px,4.4vw,20px);
  padding:4px 0 6px;
}
#scoreBar .heart{filter:drop-shadow(0 1px 1px rgba(255,92,138,.4));}

/* zona de juego */
#playArea{
  position:relative;
  flex:1;
  z-index:2;
  overflow:hidden;
  touch-action:none;
}
.falling{
  position:absolute;
  top:-50px;
  font-size:34px;
  will-change:transform;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));
}
#kittyChar{
  position:absolute;
  bottom:10px;
  width:84px;height:84px;
  transform:translateX(-50%);
  will-change:left;
  z-index:5;
}
.catch-flash{
  position:absolute;
  font-size:30px;
  pointer-events:none;
  animation:catchPop .5s ease-out forwards;
  z-index:6;
}
@keyframes catchPop{
  0%{transform:scale(.4) translateY(0);opacity:1;}
  100%{transform:scale(1.8) translateY(-30px);opacity:0;}
}
.hint{
  position:absolute;
  bottom:104px;
  left:0;right:0;
  text-align:center;
  color:#d76;
  font-size:13px;
  opacity:.8;
  animation:pulse 2s infinite;
  pointer-events:none;
}

/* =========================================================
   PANTALLA FINAL — CARTA
   ========================================================= */
#finale{
  position:absolute;inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
}
#finale.show{display:flex;}
#confettiCanvas{position:absolute;inset:0;z-index:1;pointer-events:none;}
.love-card{
  position:relative;
  z-index:2;
  background:rgba(255,255,255,.92);
  border:3px solid var(--pink);
  border-radius:26px;
  max-width:340px;
  width:100%;
  padding:30px 24px 34px;
  text-align:center;
  box-shadow:0 18px 50px rgba(255,92,138,.35);
  animation:cardIn .8s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes cardIn{0%{transform:scale(.6) translateY(40px);opacity:0;}100%{transform:scale(1) translateY(0);opacity:1;}}
.love-card .big-heart{font-size:46px;animation:beat 1.1s ease-in-out infinite;}
@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.18)}40%{transform:scale(1)}}
.love-card h2{
  font-family:'Pacifico',cursive;
  color:var(--pink-strong);
  font-size:clamp(22px,6.5vw,30px);
  margin:8px 0 14px;
}
.love-card p{
  color:#a55;
  font-size:clamp(15px,4.4vw,18px);
  line-height:1.6;
}
.love-card .sign{
  margin-top:16px;
  font-family:'Pacifico',cursive;
  color:var(--pink);
  font-size:18px;
}

/* matrix overlay (fase 3) */
#matrix{
  position:absolute;inset:0;
  z-index:45;
  display:none;
  background:#000;
  color:var(--green);
  font-family:'Courier New',monospace;
  font-size:14px;
  line-height:1;
  overflow:hidden;
  white-space:pre;
  text-shadow:0 0 6px rgba(0,255,0,.7);
}
</style>
</head>
<body>
<div id="app">
  <div class="safe">

    <!-- FASE 0 -->
    <div id="unlock" class="screen active">
      <div class="tap">[ Toca la pantalla para iniciar ]</div>
    </div>

    <!-- FASE 1-3 -->
    <div id="terminal" class="screen">
      <div class="term-inner">
        <div id="termText"></div>
        <div id="termButtons">
          <button class="term-btn" id="btnYes">SÍ</button>
          <button class="term-btn" id="btnNo">NO</button>
        </div>
      </div>
    </div>

    <!-- matrix transición -->
    <div id="matrix"></div>

    <!-- FASE 4 -->
    <div id="kitty" class="screen">
      <div class="kitty-inner">
        <div class="bg-hearts" id="bgHearts"></div>

        <div id="counterWrap">
          <div class="title">Juntos desde el primer día 💗</div>
          <div id="counter"></div>
        </div>

        <div id="scoreBar">Atrapa <span class="heart">💖</span> <span id="score">0</span> / 50</div>

        <div id="playArea">
          <div class="hint">👆 Arrastra a Hello Kitty para atrapar</div>
          <!-- Hello Kitty SVG -->
          <svg id="kittyChar" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="50" cy="92" rx="30" ry="5" fill="rgba(0,0,0,0.08)"/>
            <!-- orejas -->
            <path d="M22 28 Q24 8 38 22 Z" fill="#fff" stroke="#333" stroke-width="2"/>
            <path d="M78 28 Q76 8 62 22 Z" fill="#fff" stroke="#333" stroke-width="2"/>
            <!-- cabeza -->
            <ellipse cx="50" cy="50" rx="34" ry="29" fill="#fff" stroke="#333" stroke-width="2.5"/>
            <!-- lazo rojo -->
            <g>
              <path d="M70 30 L84 22 L84 42 Z" fill="#ff3b6b" stroke="#c2003c" stroke-width="1.5"/>
              <path d="M84 22 L96 30 L84 42 Z" fill="#ff5c84" stroke="#c2003c" stroke-width="1.5"/>
              <circle cx="84" cy="32" r="5" fill="#ff3b6b" stroke="#c2003c" stroke-width="1.5"/>
            </g>
            <!-- ojos -->
            <ellipse cx="38" cy="52" rx="3.4" ry="5" fill="#333"/>
            <ellipse cx="62" cy="52" rx="3.4" ry="5" fill="#333"/>
            <!-- nariz -->
            <ellipse cx="50" cy="58" rx="3.6" ry="2.6" fill="#ffcf2e"/>
            <!-- bigotes -->
            <line x1="16" y1="50" x2="30" y2="51" stroke="#333" stroke-width="1.6"/>
            <line x1="15" y1="57" x2="30" y2="57" stroke="#333" stroke-width="1.6"/>
            <line x1="70" y1="51" x2="84" y2="50" stroke="#333" stroke-width="1.6"/>
            <line x1="70" y1="57" x2="85" y2="57" stroke="#333" stroke-width="1.6"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- FINAL -->
    <div id="finale">
      <canvas id="confettiCanvas"></canvas>
      <div class="love-card">
        <div class="big-heart">💖</div>
        <h2 id="finalTitle">Para la novia más hermosa del mundo</h2>
        <p id="finalMsg"></p>
        <div class="sign" id="finalSign">— Con todo mi amor 💕</div>
      </div>
    </div>

  </div>
</div>

<script>
/* =========================================================
   ⚙️  CONFIGURACIÓN — CAMBIA ESTOS VALORES
   ========================================================= */
const CONFIG = {
  // Fecha de inicio (Año, Mes-1, Día, Hora, Min, Seg)  ← ¡el mes empieza en 0! Febrero = 1
  startDate: new Date(2025, 6, 13, 0, 0, 0),

  // Mensaje de la carta final
  finalTitle: "Para la novia más hermosa del mundo",
  finalMessage: "Cada segundo a tu lado es mi sorpresa favorita. Gracias por existir, por tu risa y por ser mi lugar seguro. Te amo más de lo que las palabras pueden escribir. 💗",
  finalSign: "— Tuyo, siempre 💕",

  targetScore: 50
};

/* =========================================================
   WEB AUDIO API — sonidos sintetizados
   ========================================================= */
let actx = null;
function initAudio(){
  if(!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(actx.state === 'suspended') actx.resume();
}
function tone({freq=440, type='sine', dur=0.08, vol=0.2, slideTo=null, delay=0}){
  if(!actx) return;
  const t = actx.currentTime + delay;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(actx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}
// clic de teclado mecánico
function sndKey(){
  if(!actx) return;
  const f = 1400 + Math.random()*900;
  tone({freq:f, type:'square', dur:0.025, vol:0.05});
  tone({freq:160, type:'triangle', dur:0.03, vol:0.04});
}
// beep grave de error (placa base)
function sndError(){
  tone({freq:200, type:'square', dur:0.18, vol:0.22});
  tone({freq:150, type:'square', dur:0.35, vol:0.22, delay:0.18});
}
// carga exitosa ascendente mágica
function sndSuccess(){
  const notes=[392,523,659,784,1046];
  notes.forEach((n,i)=>tone({freq:n,type:'triangle',dur:0.16,vol:0.18,delay:i*0.08}));
  tone({freq:1046,slideTo:2093,type:'sine',dur:0.5,vol:0.15,delay:0.45});
}
// atrapar objeto — agudo alegre
function sndCatch(){
  const f = 880 + Math.random()*400;
  tone({freq:f, slideTo:f*1.6, type:'sine', dur:0.12, vol:0.18});
}
// confeti final
function sndWin(){
  const notes=[523,659,784,1046,1318,1568];
  notes.forEach((n,i)=>tone({freq:n,type:'triangle',dur:0.25,vol:0.2,delay:i*0.1}));
}

/* =========================================================
   NAVEGACIÓN ENTRE PANTALLAS
   ========================================================= */
const screens = {
  unlock: document.getElementById('unlock'),
  terminal: document.getElementById('terminal'),
  kitty: document.getElementById('kitty')
};
function show(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* =========================================================
   FASE 0 — desbloqueo de audio
   ========================================================= */
document.getElementById('unlock').addEventListener('pointerdown', ()=>{
  initAudio();
  // beep silencioso para asegurar desbloqueo
  tone({freq:600,dur:0.001,vol:0.001});
  // ocultar del todo la pantalla de inicio (su CSS la mantenía visible encima)
  screens.unlock.style.display = 'none';
  show('terminal');
  startTerminal();
}, {once:true});

/* =========================================================
   FASE 1/2 — TERMINAL typewriter
   ========================================================= */
const termText = document.getElementById('termText');
const termButtons = document.getElementById('termButtons');
const TERM_LINES = [
  "> Accediendo a archivos confidenciales del sistema...",
  "> Comprobando nivel de belleza... [100%]",
  "> Identidad detectada: La novia mas hermosa del mundo.",
  "> ¿Deseas iniciar sesion para ver tu sorpresa?"
];
let typingTimer = null;

function startTerminal(){
  termButtons.classList.remove('show');
  termText.innerHTML = '';
  typeLines(0, 0);
}
function typeLines(line, char){
  if(line >= TERM_LINES.length){
    // cursor final + mostrar botones
    termText.innerHTML += '<span class="cursor"></span>';
    termButtons.classList.add('show');
    return;
  }
  const current = TERM_LINES[line];
  if(char === 0 && line > 0) termText.append(document.createTextNode('\n'));
  if(char < current.length){
    termText.append(document.createTextNode(current[char]));
    if(current[char] !== ' ') sndKey();
    typingTimer = setTimeout(()=>typeLines(line, char+1), 28 + Math.random()*30);
  } else {
    typingTimer = setTimeout(()=>typeLines(line+1, 0), 420);
  }
}

// botón NO → bucle
document.getElementById('btnNo').addEventListener('click', ()=>{
  clearTimeout(typingTimer);
  sndError();
  const inner = document.querySelector('#terminal .term-inner');
  inner.classList.add('glitch-flash');
  setTimeout(()=>{
    inner.classList.remove('glitch-flash');
    startTerminal();   // reinicia desde el principio
  }, 180);
});

// botón SÍ → fase 3
document.getElementById('btnYes').addEventListener('click', ()=>{
  clearTimeout(typingTimer);
  sndSuccess();
  termButtons.classList.remove('show');
  runMatrix();
});

/* =========================================================
   FASE 3 — matrix glitch + transición
   ========================================================= */
function runMatrix(){
  const m = document.getElementById('matrix');
  m.style.display = 'block';
  const cols = Math.floor(window.innerWidth / 10);
  const rows = Math.floor(window.innerHeight / 12);
  const chars = "アイウエオカ01ABCDEF$#%&@?<>*+ハニ★彡ﾊﾐ";
  let frames = 0;
  const iv = setInterval(()=>{
    let out = '';
    for(let r=0;r<rows;r++){
      let row='';
      for(let c=0;c<cols;c++){
        row += chars[Math.floor(Math.random()*chars.length)];
      }
      out += row + '\n';
    }
    m.textContent = out;
    frames++;
  }, 60);

  setTimeout(()=>{
    clearInterval(iv);
    m.style.transition = 'opacity .8s ease';
    m.style.opacity = '0';
    show('kitty');
    startKittyWorld();
    setTimeout(()=>{ m.style.display='none'; m.style.opacity='1'; }, 900);
  }, 1200);
}

/* =========================================================
   FASE 4 — contador de tiempo juntos
   ========================================================= */
const counterEl = document.getElementById('counter');
function fmtUnit(n,l){
  return `<div class="unit"><span class="num">${n}</span><span class="lbl">${l}</span></div>`;
}
function updateCounter(){
  const now = new Date();
  let diff = now - CONFIG.startDate;
  if(diff < 0) diff = 0;

  let s = Math.floor(diff/1000);
  // años y meses por calendario
  let years = now.getFullYear() - CONFIG.startDate.getFullYear();
  let months = now.getMonth() - CONFIG.startDate.getMonth();
  let days = now.getDate() - CONFIG.startDate.getDate();
  let hours = now.getHours() - CONFIG.startDate.getHours();
  let mins = now.getMinutes() - CONFIG.startDate.getMinutes();
  let secs = now.getSeconds() - CONFIG.startDate.getSeconds();

  if(secs < 0){secs+=60;mins--;}
  if(mins < 0){mins+=60;hours--;}
  if(hours < 0){hours+=24;days--;}
  if(days < 0){
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    days += prevMonth; months--;
  }
  if(months < 0){months+=12;years--;}

  counterEl.innerHTML =
    fmtUnit(years,'Años')+fmtUnit(months,'Meses')+fmtUnit(days,'Días')+
    fmtUnit(hours,'Horas')+fmtUnit(mins,'Min')+fmtUnit(secs,'Seg');
}

/* =========================================================
   FASE 4 — corazones de fondo
   ========================================================= */
function spawnBgHearts(){
  const wrap = document.getElementById('bgHearts');
  const emojis = ['💗','💕','🤍','💖','🌸'];
  for(let i=0;i<16;i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.fontSize = (14 + Math.random()*22) + 'px';
    s.style.animationDuration = (7 + Math.random()*9) + 's';
    s.style.animationDelay = (-Math.random()*12) + 's';
    wrap.appendChild(s);
  }
}

/* =========================================================
   FASE 4 — MINIJUEGO catcher
   ========================================================= */
let gameRunning = false;
let score = 0;
let kittyX = 0;
let spawnTimer = null;
let rafId = null;
let fallers = [];
const playArea = document.getElementById('playArea');
const kittyChar = document.getElementById('kittyChar');
const scoreEl = document.getElementById('score');

function startKittyWorld(){
  updateCounter();
  setInterval(updateCounter, 1000);
  spawnBgHearts();
  startGame();
}

function startGame(){
  gameRunning = true;
  score = 0;
  scoreEl.textContent = '0';
  fallers.forEach(f=>f.el.remove());
  fallers = [];
  kittyX = playArea.clientWidth/2;
  kittyChar.style.left = kittyX + 'px';

  // control táctil + ratón
  const move = (clientX)=>{
    const rect = playArea.getBoundingClientRect();
    let x = clientX - rect.left;
    x = Math.max(42, Math.min(rect.width-42, x));
    kittyX = x;
    kittyChar.style.left = x + 'px';
  };
  playArea.addEventListener('touchstart', e=>{e.preventDefault();move(e.touches[0].clientX);}, {passive:false});
  playArea.addEventListener('touchmove', e=>{e.preventDefault();move(e.touches[0].clientX);}, {passive:false});
  playArea.addEventListener('pointermove', e=>{ if(e.pointerType==='mouse' && e.buttons) move(e.clientX); });
  playArea.addEventListener('pointerdown', e=>{ if(e.pointerType==='mouse') move(e.clientX); });

  spawnLoop();
  rafId = requestAnimationFrame(gameLoop);
}

const FALL_EMOJIS = ['💖','💌','⭐','💕','🌟','💝','🌸'];
function spawnLoop(){
  if(!gameRunning) return;
  const el = document.createElement('div');
  el.className = 'falling';
  el.textContent = FALL_EMOJIS[Math.floor(Math.random()*FALL_EMOJIS.length)];
  const w = playArea.clientWidth;
  const x = 24 + Math.random()*(w-48);
  el.style.left = x + 'px';
  el.style.transform = 'translateX(-50%)';
  playArea.appendChild(el);
  fallers.push({el, x, y:-40, speed: 1.6 + Math.random()*2.2});
  spawnTimer = setTimeout(spawnLoop, 600 + Math.random()*600);
}

function gameLoop(){
  if(!gameRunning) return;
  const h = playArea.clientHeight;
  const catchY = h - 84;   // altura de Hello Kitty
  for(let i=fallers.length-1;i>=0;i--){
    const f = fallers[i];
    f.y += f.speed;
    f.el.style.top = f.y + 'px';
    // colisión
    if(f.y > catchY-30 && f.y < catchY+50 && Math.abs(f.x - kittyX) < 50){
      catchObject(f.x, f.y, f.el.textContent);
      f.el.remove();
      fallers.splice(i,1);
      continue;
    }
    if(f.y > h+50){
      f.el.remove();
      fallers.splice(i,1);
    }
  }
  rafId = requestAnimationFrame(gameLoop);
}

function catchObject(x,y,emoji){
  score++;
  scoreEl.textContent = score;
  sndCatch();
  const flash = document.createElement('div');
  flash.className = 'catch-flash';
  flash.textContent = '✨';
  flash.style.left = x + 'px';
  flash.style.top = (playArea.clientHeight-90) + 'px';
  flash.style.transform = 'translateX(-50%)';
  playArea.appendChild(flash);
  setTimeout(()=>flash.remove(), 500);

  // pequeño rebote de kitty
  kittyChar.animate(
    [{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.25)'},{transform:'translateX(-50%) scale(1)'}],
    {duration:200}
  );

  if(score >= CONFIG.targetScore){
    endGame();
  }
}

/* =========================================================
   PANTALLA FINAL — congelar + confeti + carta
   ========================================================= */
function endGame(){
  gameRunning = false;
  clearTimeout(spawnTimer);
  cancelAnimationFrame(rafId);
  // freeze: dejar objetos quietos un instante
  document.getElementById('finalTitle').textContent = CONFIG.finalTitle;
  document.getElementById('finalMsg').textContent = CONFIG.finalMessage;
  document.getElementById('finalSign').textContent = CONFIG.finalSign;

  setTimeout(()=>{
    sndWin();
    document.getElementById('finale').classList.add('show');
    launchConfetti();
  }, 400);
}

function launchConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth*dpr;
  canvas.height = window.innerHeight*dpr;
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  ctx.scale(dpr,dpr);
  const W = window.innerWidth, H = window.innerHeight;
  const colors = ['#FF5C8A','#FF8FB1','#FFC2DD','#FFFFFF','#FFD6E8','#ffcf2e'];
  const pieces = [];
  for(let i=0;i<160;i++){
    pieces.push({
      x:Math.random()*W,
      y:Math.random()*-H,
      r:4+Math.random()*6,
      c:colors[Math.floor(Math.random()*colors.length)],
      vy:1.5+Math.random()*3.5,
      vx:-1.5+Math.random()*3,
      rot:Math.random()*Math.PI,
      vr:-0.1+Math.random()*0.2,
      shape:Math.random()<0.5?'rect':'heart'
    });
  }
  function drawHeart(x,y,s){
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.bezierCurveTo(x-s,y-s, x-s*1.5,y+s*0.4, x,y+s*1.2);
    ctx.bezierCurveTo(x+s*1.5,y+s*0.4, x+s,y-s, x,y);
    ctx.fill();
  }
  let t = 0;
  (function anim(){
    ctx.clearRect(0,0,W,H);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y>H+20){p.y=-20;p.x=Math.random()*W;}
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle=p.c;
      if(p.shape==='rect'){ ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); }
      else { drawHeart(0,0,p.r*0.7); }
      ctx.restore();
    });
    t++;
    if(t < 600) requestAnimationFrame(anim);
  })();
}

/* evitar gestos de navegación / zoom en iOS */
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
window.addEventListener('resize', ()=>{
  if(gameRunning){
    kittyX = Math.min(kittyX, playArea.clientWidth-42);
    kittyChar.style.left = kittyX+'px';
  }
});
