<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd7e7">
  <meta name="description" content="Nuestro pequeño rincón 💗">
  <title>Los pequegodi llevan 💗</title>
  <style>
    :root {
      color-scheme: light;
      --pink: #ff5d91;
      --pink-dark: #e94e82;
      --pink-soft: #ffe2ee;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: var(--pink);
      background: radial-gradient(ellipse at 50% 43%, #fff0f6 0%, #ffe1ed 48%, #ffc9df 100%);
    }
    
    #sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .heart {
      position: absolute;
      bottom: -35px;
      line-height: 1;
      opacity: 0;
      animation: float-up var(--duration) linear var(--delay) infinite;
      will-change: transform, opacity;
      user-select: none;
    }
    @keyframes float-up {
      0% { transform: translate3d(0, 0, 0) rotate(0); opacity: 0; }
      12%, 82% { opacity: .78; }
      100% { transform: translate3d(var(--drift), -115vh, 0) rotate(35deg); opacity: 0; }
    }
    main {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 38px 16px;
      text-align: center;
    }
    .logo {
      margin-bottom: 12px;
      font-size: clamp(48px, 9vw, 68px);
      line-height: 1;
      filter: drop-shadow(0 5px 0 #ff9dbb);
      animation: heartbeat 1.7s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.1); }
      30% { transform: scale(1); }
    }
    h1 {
      margin: 0 0 24px;
      color: var(--pink);
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1.15;
      text-shadow: 0 2px #fff;
    }
    #timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(66px, 82px));
      gap: 9px;
      justify-content: center;
      width: min(100%, 355px);
    }
    .unit {
      min-width: 0;
      padding: 13px 5px 10px;
      border: 2px solid #fff;
      border-radius: 18px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 8px 20px rgba(237,123,166,.2);
    }
    .num {
      color: var(--pink);
      font-size: clamp(24px, 5vw, 35px);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .lab {
      margin-top: 7px;
      color: #df718f;
      font-size: 10px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .sub {
      margin-top: 21px;
      color: #d95f86;
      font-size: clamp(12px, 3vw, 14px);
    }
    .phrase {
      position: fixed;
      z-index: 4;
      top: 12%;
      left: 50%;
      max-width: calc(100vw - 24px);
      transform: translate(-50%, -8px);
      color: #ff4f87;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(24px, 5vw, 38px);
      font-weight: bold;
      text-align: center;
      text-shadow: 0 2px #fff;
      opacity: 0;
      transition: opacity .65s ease, transform .65s ease;
      pointer-events: none;
      white-space: normal;
    }
    .phrase.show { opacity: 1; transform: translate(-50%, 0); }
    .sticker, .kitty {
      position: fixed;
      z-index: 1;
      width: clamp(90px, 15vw, 175px);
      height: auto;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 6px 5px rgba(196,92,128,.18));
      animation: bob 7s ease-in-out infinite;
    }
    .s1 { left: 2%; top: 12%; transform: rotate(-7deg); }
    .s2 { right: 1%; top: 14%; animation-delay: -2s; }
    .s3 { left: 1%; bottom: 4%; animation-delay: -4s; }
    .s4 { right: 2%; bottom: 3%; animation-delay: -1s; }
    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -12px; }
    }
    .kitty { width: clamp(54px, 7vw, 82px); }
    .k1 { left: 16%; bottom: 17%; }
    .k2 { right: 15%; top: 48%; animation-delay: -3s; }
    @media (max-width: 520px) {
      main { padding-top: 65px; padding-bottom: 35px; }
      #timer { grid-template-columns: repeat(3, minmax(66px, 82px)); }
      .sticker { width: 100px; opacity: .88; }
      .s1 { left: -18px; top: 8%; }
      .s2 { right: -20px; top: 11%; }
      .s3 { left: -20px; bottom: 3%; }
      .s4 { right: -20px; bottom: 3%; }
      .k1 { left: 8%; bottom: 19%; }
      .k2 { right: 8%; top: 68%; }
      .phrase { top: 9%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    <div id="timer" aria-label="Tiempo desde que empezamos a salir">

  <script>
    (() => {
      "use strict";

      // Fecha local: 13 de julio de 2025 a las 00:00.
      const startDate = new Date(2025, 6, 13, 0, 0, 0);
      const fields = {
        years: document.getElementById("years"),
        months: document.getElementById("months"),
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };

      function addCalendarMonths(date, count) {
        const result = new Date(date);
        const originalDay = result.getDate();
        result.setDate(1);
        result.setMonth(result.getMonth() + count);
        const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
        result.setDate(Math.min(originalDay, lastDay));
        return result;
      }

      function updateCounter() {
        const now = new Date();
        if (now < startDate) return;

        let years = now.getFullYear() - startDate.getFullYear();
        while (addCalendarMonths(startDate, years * 12) > now) years--;

        let cursor = addCalendarMonths(startDate, years * 12);
        let months = 0;
        while (months < 11 && addCalendarMonths(cursor, months + 1) <= now) months++;
        cursor = addCalendarMonths(cursor, months);

        let remaining = now.getTime() - cursor.getTime();
        const days = Math.floor(remaining / 86400000);
        remaining -= days * 86400000;
        const hours = Math.floor(remaining / 3600000);
        remaining -= hours * 3600000;
        const minutes = Math.floor(remaining / 60000);
        remaining -= minutes * 60000;
        const seconds = Math.floor(remaining / 1000);

        fields.years.textContent = years;
        fields.months.textContent = months;
        fields.days.textContent = days;
        fields.hours.textContent = hours;
        fields.minutes.textContent = minutes;
        fields.seconds.textContent = seconds;
      }

      updateCounter();
      window.setInterval(updateCounter, 1000);

      const phrases = [
        "pequegodi", "bonita", "mi niña", "mi princesa",
        "te quiero", "preciosa", "beso besito"
      ];
      const phraseElement = document.getElementById("phrase");
      let phraseIndex = -1;
      let phraseTimeout;

      function showNextPhrase() {
        phraseElement.classList.remove("show");
        window.clearTimeout(phraseTimeout);
        window.setTimeout(() => {
          phraseIndex = (phraseIndex + 1) % phrases.length;
          phraseElement.textContent = phrases[phraseIndex];
          phraseElement.classList.add("show");
          phraseTimeout = window.setTimeout(() => {
            phraseElement.classList.remove("show");
          }, 3000);
        }, 450);
      }

      window.setTimeout(showNextPhrase, 1000);
      window.setInterval(showNextPhrase, 5000);

      // Número limitado de corazones para mantener la página ligera.
      const sky = document.getElementById("sky");
      const heartColors = ["#ff8db3", "#ffb5ce", "#ffffff", "#ffd84d", "#f86c9d"];
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < 30; i++) {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = "♥";
        heart.style.left = (i * 37 % 100) + "%";
        heart.style.fontSize = (11 + (i * 7 % 13)) + "px";
        heart.style.color = heartColors[i % heartColors.length];
        heart.style.setProperty("--duration", (12 + (i % 8) * 2) + "s");
        heart.style.setProperty("--delay", (-((i * 3) % 18)) + "s");
        heart.style.setProperty("--drift", ((i % 2 ? 1 : -1) * (8 + i % 20)) + "px");
        fragment.appendChild(heart);
      }
      sky.appendChild(fragment);
    })();
  </script>
</body>
</html>
